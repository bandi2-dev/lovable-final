apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-analyzer
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: resume-analyzer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-analyzer
                port:
                  number: 80
