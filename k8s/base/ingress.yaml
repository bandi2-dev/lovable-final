apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-analyzer
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - resumeai.yourdomain.com
    secretName: resume-analyzer-tls
  rules:
  - host: resumeai.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: resume-analyzer
            port:
              number: 8080